services:
  db:
    image: postgres:16-alpine
    container_name: odvoz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-odvoz}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-odvoz}"]
      interval: 5s
      timeout: 3s
      retries: 12
  app:
    build: .
    container_name: odvoz-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # baza
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-odvoz}
      # časovni pas (obvestila ob 18:00 po slovenskem času)
      TZ: Europe/Ljubljana
      # javni naslov aplikacije (za povezavo do odjave v e-pošti)
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      # SMTP (nodemailer) — obvezno za dejansko pošiljanje
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # zaščita zunanjega cron klica (neobvezno): /api/cron/daily?secret=...
      CRON_SECRET: ${CRON_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      ALLOW_OPEN_ADMIN: ${ALLOW_OPEN_ADMIN:-false}
    ports:
      - "${APP_PORT:-3000}:3000"
volumes:
  pgdata:
