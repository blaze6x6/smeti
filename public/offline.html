<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#faf7ef">
  <title>Brez povezave — Koledar odvoza</title>
  <link rel="stylesheet" href="/themes.css">
  <script>(function(){try{var t=localStorage.getItem("odvoz.tema")||"limeta";if(t==="auto")t=matchMedia("(prefers-color-scheme: dark)").matches?"polnoc":"limeta";if(!/^[a-z0-9-]+$/.test(t))t="limeta";document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--color-paper-50,#faf7ef);color:var(--color-ink,#12281d);font-family:system-ui,Arial,sans-serif;padding:16px;box-sizing:border-box}
    .k{background:var(--color-card,#fff);border:1px solid var(--color-paper-200,#eae2cb);border-radius:20px;padding:32px;max-width:380px;text-align:center}
    h1{font-size:1.4rem;margin:0 0 8px}
    p{color:var(--color-ink-soft,#4a5d52);line-height:1.5}.c{font-size:11px;margin:20px 0 0}
    button{background:var(--color-btn,#12281d);color:var(--color-btn-text,#fff);border:0;border-radius:999px;padding:14px 28px;font-size:16px;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <div class="k">
    <h1>Ni povezave</h1>
    <p>Koledar odvoza potrebuje internet, da prikaže najnovejši urnik. Preveri povezavo in poskusi znova.</p>
    <button onclick="location.reload()">Poskusi znova</button>
    <p class="c">Created by Matjaž Tekavec</p>
  </div>
</body>
</html>
