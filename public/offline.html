<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#faf7ef">
  <title>Brez povezave — Koledar odvoza</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf7ef;color:#12281d;font-family:system-ui,Arial,sans-serif;padding:16px;box-sizing:border-box}
    .k{background:#fff;border:1px solid #eae2cb;border-radius:20px;padding:32px;max-width:380px;text-align:center}
    h1{font-size:1.4rem;margin:0 0 8px}
    p{color:#4a5d52;line-height:1.5}
    button{background:#12281d;color:#fff;border:0;border-radius:999px;padding:14px 28px;font-size:16px;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <div class="k">
    <h1>Ni povezave</h1>
    <p>Koledar odvoza potrebuje internet, da prikaže najnovejši urnik. Preveri povezavo in poskusi znova.</p>
    <button onclick="location.reload()">Poskusi znova</button>
  </div>
</body>
</html>
